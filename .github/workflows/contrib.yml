name: Generate Contribution Bear

on:
  schedule:
    - cron: "0 5 * * *"   # every day at 05:00 UTC (~02:00 in Brasília)
  workflow_dispatch:        # allows running manually from the Actions tab
  push:
    branches:
      - main

permissions:
  contents: write

# Both workflows commit to dist/; run one at a time to avoid push conflicts.
concurrency:
  group: readme-assets
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install requests

      - name: Generate contrib-bear.svg
        env:
          GH_USERNAME: TiagoSBittencourt
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python generate_contrib.py

      - name: Commit updated contrib-bear.svg
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add dist/contrib-bear.svg
          git diff --cached --quiet && echo "Nothing new to commit" || git commit -m "chore: update contribution graph"
          git pull --rebase
          git push
