name: Generate Contribution Bear

on:
  schedule:
    - cron: "0 5 * * *"   # todo dia às 05:00 UTC (~02:00 em Brasília)
  workflow_dispatch:        # permite rodar manualmente pela aba Actions
  push:
    branches:
      - main

permissions:
  contents: write

# Os dois workflows commitam em dist/; roda um de cada vez para evitar conflito no push.
concurrency:
  group: readme-assets
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependências
        run: pip install requests

      - name: Gerar contrib-bear.svg
        env:
          GH_USERNAME: TiagoSBittencourt
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python generate_contrib.py

      - name: Commitar contrib-bear.svg atualizado
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add dist/contrib-bear.svg
          git diff --cached --quiet && echo "Nada novo para commitar" || git commit -m "chore: atualizar gráfico de contribuições"
          git pull --rebase
          git push
