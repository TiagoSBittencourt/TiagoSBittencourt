name: Generate GitHub Trophies

on:
  schedule:
    - cron: "0 6 1 * *"   # 1st of every month at 06:00 UTC (~03:00 in Brasília)
  workflow_dispatch:        # allows running manually from the Actions tab
  push:
    branches:
      - main

permissions:
  contents: write

# Both workflows commit to dist/; run one at a time to avoid push conflicts.
concurrency:
  group: readme-assets
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install requests

      - name: Generate trophies.svg
        env:
          GH_USERNAME: TiagoSBittencourt
          # Uses the automatic GITHUB_TOKEN. To include private contributions,
          # create a GH_PAT secret (classic PAT with read:user/repo scope) and swap it below.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python generate_stats.py

      - name: Commit updated trophies.svg
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add dist/trophies.svg
          git diff --cached --quiet && echo "Nothing new to commit" || git commit -m "chore: update GitHub trophies"
          git pull --rebase
          git push
