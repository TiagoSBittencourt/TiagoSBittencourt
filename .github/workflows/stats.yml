name: Generate GitHub Trophies

on:
  schedule:
    - cron: "0 6 1 * *"   # dia 1 de cada mês às 06:00 UTC (~03:00 em Brasília)
  workflow_dispatch:        # permite rodar manualmente pela aba Actions
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependências
        run: pip install requests

      - name: Gerar trophies.svg
        env:
          GH_USERNAME: TiagoSBittencourt
          # Usa o GITHUB_TOKEN automático. Para incluir contribuições privadas,
          # crie um secret GH_PAT (PAT clássico com escopo read:user/repo) e troque abaixo.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python generate_stats.py

      - name: Commitar trophies.svg atualizado
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add dist/trophies.svg
          git diff --cached --quiet && echo "Nada novo para commitar" || git commit -m "chore: atualizar trophies do GitHub"
          git push
